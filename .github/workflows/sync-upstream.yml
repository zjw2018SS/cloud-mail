name: Sync upstream

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Sync repository tree from maillab/cloud-mail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main

          upstream_dir="$(mktemp -d)"
          git worktree add --detach "$upstream_dir" upstream/main
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/deploy-cloudflare.yml' \
            --exclude='.github/workflows/sync-upstream.yml' \
            "$upstream_dir/" ./
          git worktree remove "$upstream_dir"

          if ! grep -qxF 'keep_vars = true' mail-worker/wrangler-action.toml; then
            grep -q '^compatibility_date = ' mail-worker/wrangler-action.toml
            sed -i '/^compatibility_date = /a keep_vars = true' mail-worker/wrangler-action.toml
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi

          git commit -m "Sync upstream maillab/cloud-mail"
          git push origin HEAD:main
